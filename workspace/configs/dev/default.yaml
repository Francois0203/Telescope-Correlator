# Development configuration — simulations, testing, learning.
#
# Load from the shell with:   load /workspace/configs/dev/default.yaml
#
# Every key here must be a field of correlator.config.Config. Unknown keys are
# rejected on load rather than ignored, so this file cannot silently drift out
# of sync with the code again.

# Array
n_ants: 8
ant_radius: 10.0            # metres

# F-engine
n_channels: 256             # power of 2
window: hanning             # rectangular / hanning / hamming / blackman
integration_time: 1.0       # seconds per output visibility

# Signal
sample_rate: 1024.0         # Hz
center_freq: 1420000000.0   # 1.42 GHz, the HI line

# Input
mode: simulate
duration: 10.0              # seconds
snr: 20.0                   # dB

# Output
output_dir: /workspace/outputs/dev
output_format: npy
