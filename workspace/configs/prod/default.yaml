# Production configuration: processing recorded telescope data.
#
# Load from the shell with:   load /workspace/configs/prod/default.yaml
#
# Every key here must be a field of correlator.config.Config. Unknown keys are
# rejected on load rather than ignored, so this file cannot silently drift out
# of sync with the code again.

# Array
n_ants: 64
ant_radius: 100.0           # metres

# F-engine
n_channels: 4096            # high resolution
window: hanning
integration_time: 1.0       # seconds per output visibility

# Signal
sample_rate: 2048000.0      # 2.048 MHz
center_freq: 1420405751.77  # HI line, precise

# Input
mode: file
input_file: /workspace/inputs/antenna_voltages.npy

# Output
output_dir: /workspace/outputs/prod
output_format: hdf5

# ---------------------------------------------------------------------------
# Not implemented. Earlier revisions of this file configured the settings
# below as though they were live; because Config.from_yaml used to discard
# unknown keys silently, loading it produced a run at default settings that
# looked successful. They are kept here as a record of intent only, and must
# stay commented out or the load will now fail loudly.
#
#   Ingest:       network streaming (tcp/udp/spead), stream buffer/timeout
#   F-engine:     quantize_bits, overlap_factor      (exist on FEngine,
#                                                      not exposed via Config)
#   Delay:        explicit phase_center vector       (pipeline uses zenith)
#   Array:        explicit per-antenna positions     (circle is generated)
#   Runtime:      chunk_size, max_integrations
#   Operations:   monitoring, logging, RFI detection, quality checks
#   Calibration:  bandpass / phase / delay calibration
# ---------------------------------------------------------------------------
