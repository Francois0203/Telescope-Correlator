services:
  correlator:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: telescope-correlator:latest
    container_name: telescope-correlator
    volumes:
      - ./workspace:/workspace
    stdin_open: true
    tty: true
    command: ["python", "-m", "correlator"]

  test:
    image: telescope-correlator:latest
    depends_on:
      - correlator
    container_name: telescope-correlator-test
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["pytest", "tests_harness/", "-v", "--tb=short"]
    environment:
      - PYTHONPATH=/workspace/app/src:/usr/local/lib/python3.11/site-packages

  # Full validation: the correlator's own suite, the analytic oracle (Tier 1)
  # and the pyuvsim cross-check (Tier 2). The image is self-contained and does
  # not need telescope-correlator:latest to exist first, so there is no build
  # ordering to get wrong on a fresh server.
  validate:
    build:
      context: .
      dockerfile: validation/Dockerfile
    image: telescope-correlator-validation:latest
    container_name: telescope-correlator-validation
    volumes:
      - ./validation/reports:/app/reports
    command:
      - python
      - run_validation.py
      - --with-pyuvsim
      - --json
      - /app/reports/validation.json

  # Tier 1 only, no pyuvsim. Runs in about a second. Same image.
  validate-quick:
    image: telescope-correlator-validation:latest
    build:
      context: .
      dockerfile: validation/Dockerfile
    container_name: telescope-correlator-validation-quick
    volumes:
      - ./validation/reports:/app/reports
    command:
      - python
      - run_validation.py
      - --json
      - /app/reports/validation-tier1.json
